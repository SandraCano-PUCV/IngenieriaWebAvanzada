<ul class="list-none space-y-4">
@for (item of Listaproducts; track item.id) {
    <li class="border rounded-lg p-4 shadow">
        <img
        [src]="item.images[0]"
        [alt]="item.nombre"
        width="120"
      >
      <h3>{{item.nombre }}</h3>
      <p>{{item.description }}</p>
      <p>Precio: ${{item.price }}</p>
      <p>Stock: {{item.stock }}</p>
    </li>
}
</ul>
